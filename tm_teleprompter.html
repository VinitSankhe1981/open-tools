<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toastmasters Teleprompter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f6f8fc;
      --surface: #ffffff;
      --surface-soft: #f8fafd;
      --border: #dfe5ef;
      --text: #202124;
      --muted: #5f6368;
      --primary: #1a73e8;
      --primary-dark: #1558b0;
      --danger: #b3261e;
      --green: #188038;
      --orange: #f29900;
      --red: #d93025;
      --shadow: 0 14px 42px rgba(60, 64, 67, 0.14);
      --radius: 26px;
      --header-bg: #ffffff;
      --header-fg: #202124;
      --font-size: 38pt;
      --line-height: 1.24;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Roboto, Arial, sans-serif;
    }

    body { overflow: hidden; }

    .app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: 76px minmax(0, 1fr);
      background:
        radial-gradient(circle at 8% 2%, rgba(26, 115, 232, 0.13), transparent 28%),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 58%);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 12px 22px;
      background: var(--header-bg);
      color: var(--header-fg);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 10px rgba(60, 64, 67, 0.08);
      transition: background 220ms ease, color 220ms ease;
      min-width: 0;
      z-index: 20;
    }

    .topbar.green { --header-bg: var(--green); --header-fg: #ffffff; border-bottom-color: transparent; }
    .topbar.orange { --header-bg: var(--orange); --header-fg: #ffffff; border-bottom-color: transparent; }
    .topbar.red { --header-bg: var(--red); --header-fg: #ffffff; border-bottom-color: transparent; }
    .topbar.flash { animation: flashPulse 700ms ease-in-out 3; }

    @keyframes flashPulse {
      0%, 100% { filter: brightness(1); }
      45% { filter: brightness(1.28); }
    }

    .brand {
      min-width: 230px;
      display: grid;
      gap: 2px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.025em;
      line-height: 1.05;
    }

    .brand-subtitle {
      font-size: 12px;
      font-weight: 500;
      opacity: 0.76;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 420px;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(26, 115, 232, 0.08);
      border: 1px solid rgba(26, 115, 232, 0.12);
      flex-shrink: 0;
    }

    .topbar.green .tabs,
    .topbar.orange .tabs,
    .topbar.red .tabs {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.26);
    }

    button {
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
      white-space: nowrap;
    }

    button:active { transform: translateY(1px); }

    .tab-btn {
      height: 36px;
      padding: 0 18px;
      background: transparent;
      color: #174ea6;
    }

    .topbar.green .tab-btn,
    .topbar.orange .tab-btn,
    .topbar.red .tab-btn { color: #ffffff; }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(26, 115, 232, 0.20);
    }

    .topbar.green .tab-btn.active,
    .topbar.orange .tab-btn.active,
    .topbar.red .tab-btn.active {
      background: #ffffff;
      color: #174ea6;
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      position: relative;
    }

    .timer-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 92px;
      height: 42px;
      padding: 0 14px;
      border-radius: 999px;
      background: rgba(26, 115, 232, 0.10);
      color: #174ea6;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .topbar.green .timer-pill,
    .topbar.orange .timer-pill,
    .topbar.red .timer-pill {
      background: rgba(255, 255, 255, 0.92);
      color: #174ea6;
    }

    .primary,
    .secondary,
    .danger,
    .menu-trigger {
      height: 42px;
      padding: 0 18px;
    }

    .primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(26, 115, 232, 0.24);
    }

    .primary:hover { background: var(--primary-dark); }
    .secondary { background: #edf3fb; color: #174ea6; }
    .danger { background: #fce8e6; color: var(--danger); }

    .menu-wrap { position: relative; }

    body.menu-open::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(32, 33, 36, 0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
      z-index: 35;
    }

    body.menu-open::before {
      opacity: 1;
      pointer-events: auto;
    }

    body.menu-open .topbar {
      z-index: 90;
    }

    .menu-trigger {
      width: 42px;
      padding: 0;
      background: #edf3fb;
      color: #174ea6;
      font-size: 24px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .pause-menu {
      position: absolute;
      top: 52px;
      right: 0;
      width: 356px;
      padding: 10px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(218, 220, 224, 0.96);
      box-shadow: 0 24px 64px rgba(60, 64, 67, 0.24);
      display: none;
      z-index: 60;
      backdrop-filter: blur(14px);
      transform-origin: top right;
    }

    .pause-menu.open {
      display: grid;
      gap: 6px;
      animation: menuIn 140ms ease-out;
    }

    @keyframes menuIn {
      from { opacity: 0; transform: translateY(-6px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .pause-menu-title {
      padding: 8px 10px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .menu-item {
      width: 100%;
      min-height: 68px;
      padding: 12px;
      border-radius: 16px;
      background: transparent;
      color: var(--text);
      text-align: left;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 22px;
      gap: 12px;
      align-items: center;
    }

    .menu-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #edf3fb;
      color: #174ea6;
      font-size: 20px;
      font-weight: 900;
    }

    .menu-copy {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .menu-copy strong {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.01em;
    }

    .menu-copy span {
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.32;
      white-space: normal;
    }

    .menu-check {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 14px;
      font-weight: 900;
    }

    .menu-item:hover { background: #f3f6fb; }

    .menu-item.active {
      background: #e8f0fe;
      color: #174ea6;
    }

    .menu-item.active .menu-icon {
      background: #d2e3fc;
    }

    .menu-item.active .menu-check {
      color: #174ea6;
      background: rgba(26, 115, 232, 0.12);
    }

    .main {
      min-height: 0;
      padding: 24px;
      overflow: hidden;
      width: min(100%, 1180px);
      margin: 0 auto;
    }

    .page { display: none; width: 100%; height: 100%; }
    .page.active { display: block; }

    .card,
    .prompter-shell {
      width: 100%;
      height: 100%;
      background: var(--surface);
      border: 1px solid rgba(218, 220, 224, 0.92);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 18px;
      padding: 26px;
      max-width: 1120px;
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
    }

    .page-title {
      margin: 0;
      font-size: clamp(30px, 4vw, 52px);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    .page-description {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.4;
    }

    .settings-panel {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) repeat(4, minmax(76px, 92px));
      gap: 12px;
      padding: 14px;
      border-radius: 20px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      align-items: end;
    }

    .settings-panel label:first-child {
      min-width: 0;
    }

    .settings-panel label:not(:first-child) {
      min-width: 76px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    input[type="number"],
    select {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid #c6cbd1;
      border-radius: 14px;
      background: #ffffff;
      color: var(--text);
      font-size: 15px;
      outline: none;
      min-width: 0;
    }

    .settings-panel input[type="number"] {
      text-align: center;
      padding-left: 8px;
      padding-right: 8px;
    }

    input[type="number"]:focus,
    textarea:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.16);
    }

    textarea {
      width: 100%;
      height: 100%;
      resize: none;
      border: 1px solid #c6cbd1;
      border-radius: 22px;
      padding: 24px;
      background: #fbfdff;
      color: var(--text);
      font: 500 22px/1.55 Roboto, Arial, sans-serif;
      outline: none;
      white-space: pre-wrap;
      box-shadow: inset 0 1px 0 rgba(60, 64, 67, 0.04);
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      font-size: 10px;
    }

    .prompter-shell {
      position: relative;
      background: #ffffff;
    }

    .reading-window {
      position: absolute;
      inset: 0;
      overflow: hidden;
      padding: clamp(34px, 5vw, 84px);
    }

    #scrollContent {
      position: absolute;
      left: clamp(34px, 5vw, 84px);
      right: clamp(34px, 5vw, 84px);
      top: 0;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      font-size: var(--font-size);
      line-height: var(--line-height);
      font-weight: 500;
      letter-spacing: -0.018em;
      transform: translateY(0);
      will-change: transform;
    }

    .fade-top,
    .fade-bottom {
      position: absolute;
      left: 0;
      right: 0;
      height: 16vh;
      pointer-events: none;
      z-index: 2;
    }

    .fade-top {
      top: 0;
      background: linear-gradient(to bottom, #fff 0%, rgba(255,255,255,0.9) 34%, rgba(255,255,255,0) 100%);
    }

    .fade-bottom {
      bottom: 0;
      background: linear-gradient(to top, #fff 0%, rgba(255,255,255,0.9) 34%, rgba(255,255,255,0) 100%);
    }

    .progress-wrap {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 18px;
      z-index: 4;
      display: grid;
      gap: 8px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-shadow: 0 1px 0 #fff;
    }

    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: #dfe6ee;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: var(--primary);
      border-radius: inherit;
      transition: background 180ms ease;
    }

    @media (max-width: 1120px) {
      .app { grid-template-rows: auto minmax(0, 1fr); }
      .topbar { flex-wrap: wrap; }
      .brand { min-width: 180px; }
      .top-actions { width: 100%; margin-left: 0; justify-content: flex-end; }
      .settings-panel {
        grid-template-columns: minmax(180px, 1fr) repeat(4, minmax(70px, 86px));
      }
    }

    @media (max-width: 820px) and (min-width: 721px) {
      .settings-panel {
        grid-template-columns: repeat(4, minmax(76px, 1fr));
      }

      .settings-panel label:first-child {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 720px) {
      body { overflow: auto; }
      .app { min-height: 100vh; height: auto; grid-template-rows: auto minmax(0, 1fr); }

      .topbar {
        position: sticky;
        top: 0;
        padding: 10px 12px;
        gap: 10px;
        align-items: stretch;
      }

      .brand {
        width: 100%;
        min-width: 0;
      }

      .brand-title {
        font-size: 17px;
      }

      .brand-subtitle {
        max-width: none;
        font-size: 11px;
      }

      .tabs {
        order: 3;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .tab-btn {
        width: 100%;
        height: 40px;
        padding: 0 10px;
      }

      .top-actions {
        order: 2;
        width: 100%;
        margin-left: 0;
        justify-content: space-between;
        display: grid;
        grid-template-columns: minmax(74px, 1fr) minmax(72px, auto) 46px minmax(72px, auto);
        gap: 8px;
      }

      .timer-pill,
      .primary,
      .danger,
      .menu-trigger {
        height: 44px;
      }

      .primary,
      .danger {
        padding: 0 12px;
      }

      .menu-trigger {
        width: 46px;
      }

      .main {
        width: 100%;
        max-width: 480px;
        padding: 12px;
        min-height: calc(100vh - 170px);
      }

      .card {
        min-height: calc(100vh - 190px);
        max-width: 456px;
        padding: 16px;
        gap: 12px;
        border-radius: 22px;
        grid-template-rows: auto auto minmax(280px, 1fr) auto;
      }

      .prompter-shell {
        min-height: calc(100vh - 190px);
        border-radius: 22px;
      }

      .settings-panel {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        padding: 10px;
        border-radius: 18px;
      }

      .settings-panel label:first-child {
        grid-column: 1 / -1;
      }

      .settings-panel label {
        gap: 4px;
        font-size: 11px;
      }

      .settings-panel input[type="number"],
      .settings-panel select {
        height: 40px;
        min-height: 40px;
        padding: 0 10px;
        border-radius: 12px;
        font-size: 14px;
      }

      .page-header,
      .footer-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .page-header {
        gap: 12px;
      }

      .page-title {
        font-size: 32px;
      }

      .page-description {
        font-size: 14px;
        margin-top: 8px;
      }

      #goPromptBtn {
        height: 40px;
      }

      textarea {
        min-height: 300px;
        font-size: 18px;
        padding: 18px;
        border-radius: 20px;
      }

      .pause-menu {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        top: auto;
        width: 100%;
        max-height: min(72vh, 420px);
        padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
        border-radius: 26px 26px 0 0;
        border-left: 0;
        border-right: 0;
        border-bottom: 0;
        box-shadow: 0 -18px 60px rgba(60, 64, 67, 0.28);
        transform-origin: bottom center;
      }

      .pause-menu.open {
        animation: sheetIn 180ms cubic-bezier(.2, .8, .2, 1);
      }

      @keyframes sheetIn {
        from { opacity: 0; transform: translateY(22px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .pause-menu::before {
        content: "";
        width: 44px;
        height: 4px;
        border-radius: 999px;
        background: #dadce0;
        justify-self: center;
        margin: 2px 0 4px;
      }

      .pause-menu-title {
        text-align: center;
        padding: 6px 10px 8px;
      }

      .menu-item {
        min-height: 74px;
        padding: 14px 12px;
        border-radius: 18px;
      }

      .menu-icon {
        width: 46px;
        height: 46px;
        border-radius: 16px;
      }

      .menu-copy strong {
        font-size: 16px;
      }

      .menu-copy span {
        font-size: 13px;
      }

      .reading-window {
        padding: 28px 22px;
      }

      #scrollContent {
        left: 22px;
        right: 22px;
      }

      :root { --font-size: 31pt; }
    }

    @media (max-width: 420px) {
      .settings-panel {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .top-actions {
        grid-template-columns: 1fr 1fr 46px 1fr;
      }

      .timer-pill {
        min-width: 0;
        padding: 0 8px;
      }

      .brand-subtitle {
        white-space: normal;
        line-height: 1.25;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar" id="topbar" aria-label="Teleprompter controls">
      <div class="brand">
        <div class="brand-title">Toastmasters Teleprompter</div>
        <div class="brand-subtitle" id="timingSummary">Prepared Speech · Green 05:00 · Orange 06:00 · Red 07:00 · Stop 07:30</div>
      </div>

      <nav class="tabs" role="tablist" aria-label="Teleprompter tabs">
        <button class="tab-btn active" id="editorTab" type="button" role="tab" aria-selected="true">Speech Text</button>
        <button class="tab-btn" id="promptTab" type="button" role="tab" aria-selected="false">Teleprompt</button>
      </nav>

      <div class="top-actions">
        <span class="timer-pill" id="timerPill">00:00</span>
        <button class="primary" id="startBtn" type="button">Start</button>
        <div class="menu-wrap">
          <button class="menu-trigger" id="pauseMenuBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Pause options">⋮</button>
          <div class="pause-menu" id="pauseMenu" role="menu" aria-label="Pause options">
            <div class="pause-menu-title">Pause options</div>
            <button class="menu-item" id="pauseTimeBtn" type="button" role="menuitem">
              <span class="menu-icon" aria-hidden="true">⏱</span>
              <span class="menu-copy">
                <strong id="pauseTimeLabel">Pause Time</strong>
                <span>Timer freezes. Prompting continues at the same speed.</span>
              </span>
              <span class="menu-check" aria-hidden="true">✓</span>
            </button>
            <button class="menu-item" id="pausePromptBtn" type="button" role="menuitem">
              <span class="menu-icon" aria-hidden="true">⏸</span>
              <span class="menu-copy">
                <strong id="pausePromptLabel">Pause Prompting</strong>
                <span>Prompting freezes. Timer continues normally.</span>
              </span>
              <span class="menu-check" aria-hidden="true">✓</span>
            </button>
            <button class="menu-item" id="pauseBothBtn" type="button" role="menuitem">
              <span class="menu-icon" aria-hidden="true">⏯</span>
              <span class="menu-copy">
                <strong id="pauseBothLabel">Pause Both</strong>
                <span>Timer and prompting freeze. Space bar also toggles this.</span>
              </span>
              <span class="menu-check" aria-hidden="true">✓</span>
            </button>
          </div>
        </div>
        <button class="danger" id="resetBtn" type="button">Reset</button>
      </div>
    </header>

    <section class="main">
      <section class="page active" id="editorPage" role="tabpanel" aria-labelledby="editorTab">
        <div class="card">
          <div class="page-header">
            <div>
              <h1 class="page-title">Paste your speech</h1>
              <p class="page-description">Plain text only.</p>
            </div>
            <button class="primary" id="goPromptBtn" type="button">Go to Teleprompter</button>
          </div>

          <section class="settings-panel" aria-label="Timing and display settings">
            <label>
              Level / Project
              <select id="projectPreset">
                <option value="icebreaker">Level 1 · Ice Breaker · 4–6 min</option>
				<option value="prepared" selected>Level X. Prepared Speech / Most Projects · 5–7 min</option>
                <option value="tabletopics">Table Topics · 1–2 min</option>
                <option value="evaluation">Evaluator Speech · 2–3 min</option>				
				<option value="level5-reflect">Level 5 · Reflect on Your Path · 10–12 min</option>
                <option value="custom">Custom Timing</option>
              </select>
            </label>

            <label>
              Green min
              <input id="greenAt" type="number" min="0" max="999" value="5" title="Green time in minutes" />
            </label>

            <label>
              Orange min
              <input id="orangeAt" type="number" min="0" max="999" value="6" title="Orange time in minutes" />
            </label>

            <label>
              Red min
              <input id="redAt" type="number" min="1" max="999" value="7" title="Red time in minutes" />
            </label>

            <label>
              Font pt
              <input id="fontPt" type="number" min="30" max="120" value="38" />
            </label>
          </section>

          <textarea id="speechInput" spellcheck="true">Paste your Toastmasters speech here.

Choose the Level / Project timing preset, then go to the Teleprompt tab and press Start.

The text scrolls to reach the final line by the Red timing mark. The app then gives a 30-second grace period and stops automatically.</textarea>

          <div class="footer-row">
            <span id="wordCount">0 words</span>
            <span>Shortcuts: Space = pause both · PageDown/PageUp = move prompt by 2 lines · R = reset · F = full screen</span>
          </div>
        </div>
      </section>

      <section class="page" id="promptPage" role="tabpanel" aria-labelledby="promptTab">
        <div class="prompter-shell" id="prompterShell">
          <div class="reading-window" id="readingWindow">
            <article id="scrollContent" aria-live="off"></article>
          </div>

          <div class="fade-top"></div>
          <div class="fade-bottom"></div>

          <div class="progress-wrap">
            <div class="progress-meta">
              <span id="statusText">Ready</span>
              <span id="timeText">00:00 / 07:30</span>
            </div>
            <div class="progress-track" aria-hidden="true">
              <div id="progressBar"></div>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const PRESETS = {
        prepared: { label: 'Prepared Speech / Most Pathways Projects', green: 5 * 60, orange: 6 * 60, red: 7 * 60 },
        icebreaker: { label: 'Level 1 · Ice Breaker', green: 4 * 60, orange: 5 * 60, red: 6 * 60 },
        'l1-evaluation-feedback-1': { label: 'Level 1 · Evaluation & Feedback Speech 1', green: 5 * 60, orange: 6 * 60, red: 7 * 60 },
        'l1-evaluation-feedback-2': { label: 'Level 1 · Evaluation & Feedback Speech 2', green: 5 * 60, orange: 6 * 60, red: 7 * 60 },
        'l1-researching': { label: 'Level 1 · Researching & Presenting', green: 5 * 60, orange: 6 * 60, red: 7 * 60 },
        tabletopics: { label: 'Table Topics', green: 1 * 60, orange: 90, red: 2 * 60 },
        evaluation: { label: 'Evaluator Speech', green: 2 * 60, orange: 150, red: 3 * 60 },
        'level5-reflect': { label: 'Level 5 · Reflect on Your Path', green: 10 * 60, orange: 11 * 60, red: 12 * 60 },
        custom: { label: 'Custom Timing', green: 5 * 60, orange: 6 * 60, red: 7 * 60 }
      };

      const GRACE_SECONDS = 30;
      const MANUAL_LINE_STEP = 2;
      const byId = function (id) { return document.getElementById(id); };

      const el = {
        topbar: byId('topbar'),
        editorTab: byId('editorTab'),
        promptTab: byId('promptTab'),
        editorPage: byId('editorPage'),
        promptPage: byId('promptPage'),
        goPromptBtn: byId('goPromptBtn'),
        speechInput: byId('speechInput'),
        scrollContent: byId('scrollContent'),
        readingWindow: byId('readingWindow'),
        projectPreset: byId('projectPreset'),
        greenAt: byId('greenAt'),
        orangeAt: byId('orangeAt'),
        redAt: byId('redAt'),
        fontPtInput: byId('fontPt'),
        startBtn: byId('startBtn'),
        pauseMenuBtn: byId('pauseMenuBtn'),
        pauseMenu: byId('pauseMenu'),
        pauseTimeBtn: byId('pauseTimeBtn'),
        pausePromptBtn: byId('pausePromptBtn'),
        pauseBothBtn: byId('pauseBothBtn'),
        pauseTimeLabel: byId('pauseTimeLabel'),
        pausePromptLabel: byId('pausePromptLabel'),
        pauseBothLabel: byId('pauseBothLabel'),
        resetBtn: byId('resetBtn'),
        progressBar: byId('progressBar'),
        statusText: byId('statusText'),
        timeText: byId('timeText'),
        timerPill: byId('timerPill'),
        timingSummary: byId('timingSummary'),
        wordCount: byId('wordCount')
      };

      let animationFrameId = null;
      let active = false;
      let timerPaused = false;
      let promptPaused = false;
      let lastFrameAt = 0;
      let timerElapsedMs = 0;
      let promptElapsedMs = 0;
      let redMs = 0;
      let stopMs = 0;
      let maxScrollPx = 0;
      let currentSignal = 'none';

      function setText(node, value) { if (node) node.textContent = value; }
      function setStyle(node, property, value) { if (node) node.style[property] = value; }
      function clamp(value, min, max) { return Math.min(Math.max(value, min), max); }

      function formatTime(ms) {
        const safeMs = Math.max(0, Math.round(ms));
        const totalSeconds = Math.floor(safeMs / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
      }

      function secondsToMinutesValue(seconds) { return Number((seconds / 60).toFixed(2)); }

      function readTimingSeconds() {
        let green = Math.max(0, Number(el.greenAt.value) || 0) * 60;
        let orange = Math.max(0, Number(el.orangeAt.value) || 0) * 60;
        let red = Math.max(1, Number(el.redAt.value) || 1) * 60;
        if (orange < green) orange = green;
        if (red < orange) red = orange + 1;
        el.greenAt.value = secondsToMinutesValue(green);
        el.orangeAt.value = secondsToMinutesValue(orange);
        el.redAt.value = secondsToMinutesValue(red);
        return { green: green, orange: orange, red: red, stop: red + GRACE_SECONDS };
      }

      function updateTimingSummary() {
        const preset = PRESETS[el.projectPreset.value] || PRESETS.prepared;
        const t = readTimingSeconds();
        const summary = preset.label + ' · Green ' + formatTime(t.green * 1000) + ' · Orange ' + formatTime(t.orange * 1000) + ' · Red ' + formatTime(t.red * 1000) + ' · Stop ' + formatTime(t.stop * 1000);
        setText(el.timingSummary, summary);
        setText(el.timeText, formatTime(timerElapsedMs) + ' / ' + formatTime(t.stop * 1000));
      }

      function switchTab(tabName) {
        const isEditor = tabName === 'editor';
        el.editorTab.classList.toggle('active', isEditor);
        el.promptTab.classList.toggle('active', !isEditor);
        el.editorTab.setAttribute('aria-selected', String(isEditor));
        el.promptTab.setAttribute('aria-selected', String(!isEditor));
        el.editorPage.classList.toggle('active', isEditor);
        el.promptPage.classList.toggle('active', !isEditor);
        if (!isEditor) reset();
      }

      function getWords(text) {
        const normalized = text.trim().replaceAll(String.fromCharCode(10), ' ').replaceAll(String.fromCharCode(13), ' ').replaceAll(String.fromCharCode(9), ' ');
        if (!normalized) return [];
        return normalized.split(' ').filter(Boolean);
      }

      function updateWordCount() {
        const words = getWords(el.speechInput.value);
        const minutes = redMs ? redMs / 60000 : readTimingSeconds().red / 60;
        const wpm = minutes > 0 ? Math.round(words.length / minutes) : 0;
        setText(el.wordCount, words.length + ' words · approx. ' + wpm + ' wpm to finish by Red');
      }

      function loadText() {
        const text = el.speechInput.value.trim() || 'Paste speech text in the Speech Text tab.';
        setText(el.scrollContent, text);
        document.documentElement.style.setProperty('--font-size', Math.max(30, Number(el.fontPtInput.value) || 38) + 'pt');
        updateWordCount();
      }

      function measure() {
        loadText();
        const startOffsetPx = Math.round(el.readingWindow.clientHeight * 0.18);
        setStyle(el.scrollContent, 'transform', 'translateY(' + startOffsetPx + 'px)');
        const contentHeight = el.scrollContent.scrollHeight;
        const viewportHeight = el.readingWindow.clientHeight;
        const endOffsetPx = Math.round(viewportHeight * 0.78);
        maxScrollPx = Math.max(0, contentHeight + startOffsetPx - endOffsetPx);
        return startOffsetPx;
      }

      function setToolbarSignal(signal) {
        if (signal === currentSignal) return;
        currentSignal = signal;
        el.topbar.classList.remove('green', 'orange', 'red', 'flash');
        if (signal !== 'none') {
          el.topbar.classList.add(signal);
          requestAnimationFrame(function () { el.topbar.classList.add('flash'); });
        }
      }

      function getSignal(elapsedMs) {
        const elapsedSeconds = elapsedMs / 1000;
        const t = readTimingSeconds();
        if (elapsedSeconds >= t.red) return 'red';
        if (elapsedSeconds >= t.orange) return 'orange';
        if (elapsedSeconds >= t.green) return 'green';
        return 'none';
      }

      function getStatusText() {
        if (!active) return 'Ready';
        if (timerElapsedMs >= redMs && timerElapsedMs < stopMs) return 'Red grace period · stops in ' + formatTime(stopMs - timerElapsedMs);
        if (timerPaused && promptPaused) return 'Paused: time and prompting';
        if (timerPaused) return 'Paused: time only · prompting continues';
        if (promptPaused) return 'Paused: prompting only · timer continues';
        return 'Running';
      }

      function updatePauseMenuState() {
        const timeOnly = timerPaused && !promptPaused;
        const promptOnly = promptPaused && !timerPaused;
        const both = timerPaused && promptPaused;

        el.pauseTimeBtn.classList.toggle('active', timeOnly);
        el.pausePromptBtn.classList.toggle('active', promptOnly);
        el.pauseBothBtn.classList.toggle('active', both);

        setText(el.pauseTimeLabel, timeOnly ? 'Unpause Time' : 'Pause Time');
        setText(el.pausePromptLabel, promptOnly ? 'Unpause Prompting' : 'Pause Prompting');
        setText(el.pauseBothLabel, both ? 'Unpause Both' : 'Pause Both');
      }

      function setPositionFromElapsed() {
        const scrollProgress = redMs > 0 ? clamp(promptElapsedMs / redMs, 0, 1) : 1;
        const startOffsetPx = Math.round(el.readingWindow.clientHeight * 0.18);
        const y = startOffsetPx - (maxScrollPx * scrollProgress);
        setStyle(el.scrollContent, 'transform', 'translateY(' + y + 'px)');

        const totalProgress = stopMs > 0 ? clamp(timerElapsedMs / stopMs, 0, 1) : 0;
        setStyle(el.progressBar, 'width', (totalProgress * 100) + '%');
        setStyle(el.progressBar, 'background', currentSignal === 'red' ? 'var(--red)' : currentSignal === 'orange' ? 'var(--orange)' : currentSignal === 'green' ? 'var(--green)' : 'var(--primary)');
        setText(el.timerPill, formatTime(timerElapsedMs));
        setText(el.timeText, formatTime(timerElapsedMs) + ' / ' + formatTime(stopMs));
        setText(el.statusText, getStatusText());
        updatePauseMenuState();
      }

      function tick(now) {
        if (!active) return;
        const delta = Math.max(0, now - lastFrameAt);
        lastFrameAt = now;

        if (!timerPaused) timerElapsedMs = clamp(timerElapsedMs + delta, 0, stopMs);
        if (!promptPaused) promptElapsedMs = clamp(promptElapsedMs + delta, 0, redMs);

        setToolbarSignal(getSignal(timerElapsedMs));
        setPositionFromElapsed();

        if (timerElapsedMs >= stopMs) {
          active = false;
          timerPaused = false;
          promptPaused = false;
          timerElapsedMs = stopMs;
          promptElapsedMs = redMs;
          setText(el.statusText, 'Stopped after 30-second Red grace period');
          setPositionFromElapsed();
          cancelAnimationFrame(animationFrameId);
          return;
        }

        animationFrameId = requestAnimationFrame(tick);
      }

      function ensurePromptTabAndMeasure() {
        if (el.promptPage.classList.contains('active') === false) switchTab('prompt');
        const t = readTimingSeconds();
        redMs = t.red * 1000;
        stopMs = t.stop * 1000;
        measure();
        updateTimingSummary();
      }

      function start() {
        ensurePromptTabAndMeasure();
        if (!active) {
          active = true;
          timerPaused = false;
          promptPaused = false;
          lastFrameAt = performance.now();
          setText(el.statusText, 'Running');
          updatePauseMenuState();
          animationFrameId = requestAnimationFrame(tick);
        } else {
          timerPaused = false;
          promptPaused = false;
          lastFrameAt = performance.now();
          setPositionFromElapsed();
        }
      }

      function keepLoopAlive() {
        if (!active) {
          active = true;
          lastFrameAt = performance.now();
          animationFrameId = requestAnimationFrame(tick);
        } else {
          lastFrameAt = performance.now();
        }
      }

      function setPauseMode(mode) {
        ensurePromptTabAndMeasure();

        if (mode === 'time') {
          if (timerPaused && !promptPaused) {
            timerPaused = false;
          } else {
            timerPaused = true;
            promptPaused = false;
          }
        } else if (mode === 'prompt') {
          if (promptPaused && !timerPaused) {
            promptPaused = false;
          } else {
            promptPaused = true;
            timerPaused = false;
          }
        } else if (mode === 'both') {
          if (timerPaused && promptPaused) {
            timerPaused = false;
            promptPaused = false;
          } else {
            timerPaused = true;
            promptPaused = true;
          }
        }

        keepLoopAlive();
        closePauseMenu();
        setPositionFromElapsed();
      }

      function reset() {
        active = false;
        timerPaused = false;
        promptPaused = false;
        timerElapsedMs = 0;
        promptElapsedMs = 0;
        const t = readTimingSeconds();
        redMs = t.red * 1000;
        stopMs = t.stop * 1000;
        cancelAnimationFrame(animationFrameId);
        currentSignal = 'resetting';
        setToolbarSignal('none');
        measure();
        setPositionFromElapsed();
        setText(el.statusText, 'Ready');
        updateTimingSummary();
        updatePauseMenuState();
      }

      function applyPreset() {
        const preset = PRESETS[el.projectPreset.value] || PRESETS.prepared;
        if (el.projectPreset.value !== 'custom') {
          el.greenAt.value = secondsToMinutesValue(preset.green);
          el.orangeAt.value = secondsToMinutesValue(preset.orange);
          el.redAt.value = secondsToMinutesValue(preset.red);
        }
        reset();
      }

      function togglePauseMenu() {
        const isOpen = el.pauseMenu.classList.toggle('open');
        document.body.classList.toggle('menu-open', isOpen);
        el.pauseMenuBtn.setAttribute('aria-expanded', String(isOpen));
      }

      function closePauseMenu() {
        el.pauseMenu.classList.remove('open');
        document.body.classList.remove('menu-open');
        el.pauseMenuBtn.setAttribute('aria-expanded', 'false');
      }

      function getTwoLinePromptDeltaMs() {
        if (maxScrollPx <= 0 || redMs <= 0) return 0;
        const styles = window.getComputedStyle(el.scrollContent);
        const lineHeight = parseFloat(styles.lineHeight) || (parseFloat(styles.fontSize) * 1.24) || 48;
        const linePx = lineHeight * MANUAL_LINE_STEP;
        return (linePx / maxScrollPx) * redMs;
      }

      function nudgePrompt(direction) {
        ensurePromptTabAndMeasure();
        const delta = getTwoLinePromptDeltaMs();
        promptElapsedMs = clamp(promptElapsedMs + (direction * delta), 0, redMs);
        setPositionFromElapsed();
      }

      function runSelfTests() {
        const tests = [];
        function assertTest(name, condition) {
          tests.push({ name: name, passed: Boolean(condition) });
          if (!condition) console.error('Teleprompter test failed:', name);
        }
        assertTest('topbar exists', Boolean(el.topbar));
        assertTest('timingSummary exists', Boolean(el.timingSummary));
        assertTest('pause menu exists', Boolean(el.pauseMenu));
        assertTest('pause time button exists', Boolean(el.pauseTimeBtn));
        assertTest('pause prompt button exists', Boolean(el.pausePromptBtn));
        assertTest('pause both button exists', Boolean(el.pauseBothBtn));
        assertTest('pause time label exists', Boolean(el.pauseTimeLabel));
        assertTest('pause prompt label exists', Boolean(el.pausePromptLabel));
        assertTest('pause both label exists', Boolean(el.pauseBothLabel));
        assertTest('pause menu has title', Boolean(document.querySelector('.pause-menu-title')));
        assertTest('pause menu has icons', document.querySelectorAll('.menu-icon').length === 3);
        assertTest('formatTime formats 90 seconds', formatTime(90000) === '01:30');
        assertTest('prepared preset red is 7 minutes', PRESETS.prepared.red === 420);
        assertTest('ice breaker green is 4 minutes', PRESETS.icebreaker.green === 240);
        assertTest('table topics orange is 1 minute 30 seconds', PRESETS.tabletopics.orange === 90);
        assertTest('word splitter counts simple words', getWords('one two three').length === 3);
        assertTest('word splitter ignores extra spaces', getWords('one   two').length === 2);
        assertTest('settings panel is not inside the topbar', !el.topbar.contains(el.projectPreset));
        assertTest('settings panel exists', Boolean(document.querySelector('.settings-panel')));
        assertTest('settings panel has five controls', document.querySelectorAll('.settings-panel label').length === 5);
        assertTest('manual line step is two lines', MANUAL_LINE_STEP === 2);
        if (tests.filter(function (t) { return !t.passed; }).length === 0) {
          console.info('Teleprompter self-tests passed:', tests.length);
        }
      }

      el.editorTab.addEventListener('click', function () { switchTab('editor'); });
      el.promptTab.addEventListener('click', function () { switchTab('prompt'); });
      el.goPromptBtn.addEventListener('click', function () { switchTab('prompt'); });
      el.startBtn.addEventListener('click', start);
      el.pauseMenuBtn.addEventListener('click', togglePauseMenu);
      el.pauseTimeBtn.addEventListener('click', function (event) { event.stopPropagation(); setPauseMode('time'); });
      el.pausePromptBtn.addEventListener('click', function (event) { event.stopPropagation(); setPauseMode('prompt'); });
      el.pauseBothBtn.addEventListener('click', function (event) { event.stopPropagation(); setPauseMode('both'); });
      el.resetBtn.addEventListener('click', reset);
      el.projectPreset.addEventListener('change', applyPreset);
      el.greenAt.addEventListener('change', function () { el.projectPreset.value = 'custom'; reset(); });
      el.orangeAt.addEventListener('change', function () { el.projectPreset.value = 'custom'; reset(); });
      el.redAt.addEventListener('change', function () { el.projectPreset.value = 'custom'; reset(); });
      el.fontPtInput.addEventListener('change', reset);
      el.speechInput.addEventListener('input', function () { loadText(); updateTimingSummary(); });
      window.addEventListener('resize', reset);

      document.addEventListener('click', function (event) {
        if (!el.pauseMenu.contains(event.target) && event.target !== el.pauseMenuBtn) closePauseMenu();
      });

      window.addEventListener('keydown', function (event) {
        const activeElement = document.activeElement;
        const isTyping = activeElement && ['TEXTAREA', 'INPUT', 'SELECT'].includes(activeElement.tagName);
        if (isTyping) return;

        if (event.code === 'Space') {
          event.preventDefault();
          if (!active) start();
          else setPauseMode('both');
        }

        if (event.code === 'PageDown') {
          event.preventDefault();
          nudgePrompt(1);
        }

        if (event.code === 'PageUp') {
          event.preventDefault();
          nudgePrompt(-1);
        }

        if (event.key.toLowerCase() === 'r') reset();
        if (event.key.toLowerCase() === 'f') {
          if (!document.fullscreenElement) {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
          } else if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
        if (event.key === 'Escape') closePauseMenu();
      });

      runSelfTests();
      applyPreset();
    });
  </script>
</body>
</html>
